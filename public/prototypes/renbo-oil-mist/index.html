<!doctype html>
<html lang="en">
<head>
  <base href="./vendor/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>仁博 RCS · 油雾过滤控制系统原型</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232058a5'/%3E%3Ctext x='7' y='24' fill='white' font-family='Arial' font-weight='bold' font-size='24'%3ER%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="colors.css?v=20261021-alarm-yellow-4">
  <link rel="stylesheet" href="styles.css?v=industrial-icons">
  <link rel="stylesheet" href="../portfolio.css">
</head>
<body>
  <main class="preview">
    <div class="screen-stage" id="screen-stage">
      <div class="hmi" id="hmi" data-renbo-colors aria-label="800×480 油雾过滤器控制屏">
        <header class="hmi-header" id="hmi-header"></header>
        <div class="hmi-body">
          <section class="page-content" id="page-content"></section>
          <nav class="hmi-nav" id="side-nav" aria-label="主导航"></nav>
        </div>
        <div id="modal-root"></div>
        <div class="toast" id="toast" role="status" hidden></div>
      </div>
    </div>
    <button class="preview-controller-toggle" id="preview-controller-toggle" type="button" aria-controls="preview-controller" aria-expanded="false">预览控制器</button>
    <aside class="preview-controller" id="preview-controller" aria-label="预览控制器" aria-hidden="true" hidden>
      <div class="preview-controller-header">
        <div><span class="preview-kicker">RAINBOW / RCS</span><strong id="preview-version">交互原型 V3.1.0</strong></div>
        <button class="preview-controller-close" id="preview-controller-close" type="button" aria-label="关闭预览控制器">×</button>
      </div>
      <div class="preview-controller-body">
        <div class="preview-controller-title">演示场景</div>
        <div class="scenario-controls" aria-label="演示场景">
          <button data-scenario="normal">正常运行</button>
          <button data-scenario="warning" class="selected">运行报警</button>
          <button data-scenario="fault">故障停机</button>
        </div>
        <div class="preview-controller-title pump-preview-title">回液泵状态</div>
        <div class="scenario-controls" aria-label="回液泵状态演示">
          <button data-pump-state="running" class="selected">泵运行</button>
          <button data-pump-state="stopped">泵停止</button>
          <button data-pump-state="fault">泵故障</button>
        </div>
        <div class="preview-controller-title pump-preview-title">入口压力／频率数据</div>
        <div class="scenario-controls" aria-label="入口压力与频率数据演示">
          <button data-reading-sample="normal">正常读数</button>
          <button data-reading-sample="zero">零值</button>
          <button data-reading-sample="missing">无数据</button>
        </div>
        <div class="preview-controller-title pump-preview-title">监测数值</div>
        <div class="scenario-controls" aria-label="运行参数数值演示">
          <button data-monitor-sample="normal">正常读数</button>
          <button data-monitor-sample="zero">零值</button>
          <button data-monitor-sample="missing">无数据</button>
        </div>
        <label class="scale-label">画板：800 × 480 px <select id="preview-scale" aria-label="预览比例"><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="fit">适应窗口</option></select></label>
        <p class="preview-hint">点击 HMI 画板体验启停、参数设置与报警处理。可在此切换演示场景。</p>
        <div class="preview-foot"><span><i></i>仅使用演示数据，未连接实际设备</span><span>高级参数演示密码：8888</span></div>
      </div>
    </aside>
  </main>
  <script src="../runtime.js"></script>
  <script src="../portfolio.js"></script>
</body>
</html>
