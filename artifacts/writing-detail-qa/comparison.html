<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Writing detail comparison</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #ececea;
        color: #4d4d49;
        font: 14px/20px -apple-system, BlinkMacSystemFont, sans-serif;
      }
      main {
        display: grid;
        grid-template-columns: repeat(2, 600px);
        gap: 24px;
        width: max-content;
        padding: 20px;
      }
      figure {
        margin: 0;
      }
      figcaption {
        padding: 0 0 8px;
      }
      img {
        display: block;
        width: 600px;
        height: 422px;
        object-fit: contain;
        object-position: left top;
        background: white;
      }
      .focus-frame {
        width: 600px;
        height: 240px;
        overflow: hidden;
        background: white;
      }
      .focus-frame img {
        width: 850px;
        height: auto;
        max-width: none;
      }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>Reference — benji.org/drawesome</figcaption>
        <img
          src="../../output/playwright/writing-benji-reference-20260913/reference-desktop.png"
          alt="Reference writing detail page"
        />
      </figure>
      <figure>
        <figcaption>Implementation — writing detail</figcaption>
        <img
          src="implementation-desktop-1280.jpg"
          alt="Implemented writing detail page"
        />
      </figure>
      <figure>
        <figcaption>Reference — navigation and article header</figcaption>
        <div class="focus-frame">
          <img
            src="../../output/playwright/writing-benji-reference-20260913/reference-desktop.png"
            alt="Reference navigation and article header"
          />
        </div>
      </figure>
      <figure>
        <figcaption>Implementation — navigation and article header</figcaption>
        <div class="focus-frame">
          <img
            src="implementation-desktop-1280.jpg"
            alt="Implemented navigation and article header"
          />
        </div>
      </figure>
    </main>
  </body>
</html>
