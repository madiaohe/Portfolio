<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fluid footer comparison</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #e8e8e8; font-family: Arial, sans-serif; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; min-height: 900px; padding: 16px; }
      figure { display: grid; grid-template-rows: auto 1fr; gap: 10px; min-width: 0; margin: 0; padding: 12px; background: white; }
      figcaption { color: #222; font-size: 13px; letter-spacing: .02em; }
      img { display: block; width: 100%; height: 100%; min-height: 0; object-fit: contain; background: #000; }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>REFERENCE — broad, nested black marble contours</figcaption>
        <img src="reference.png" alt="Reference" />
      </figure>
      <figure>
        <figcaption>IMPLEMENTATION — procedural animated marble footer</figcaption>
        <img src="marble-desktop-1280x720.png" alt="Implementation" />
      </figure>
    </main>
  </body>
</html>
